name: Resumen diario de emails

on:
  # Horario automatico desactivado: la automatizacion real corre como rutina en
  # la nube de Claude. Para usar este plan B, descomenta (UTC; main.py solo actua
  # cuando en Madrid es la hora 10) y define los secretos en GitHub.
  # schedule:
  #   - cron: "7 8 * * *"
  #   - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Dias hacia atras (vacio = ventana normal)"
        required: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          DAYS: ${{ github.event.inputs.days }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
